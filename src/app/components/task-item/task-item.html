<div class="task-item" [class.completed]="task.completed">
  <input
    type="checkbox"
    class="checkbox"
    [checked]="task.completed"
    (change)="onToggleComplete()"
    aria-label="Отметить задачу выполненной"
  />

  <div class="content">
    @if (!isEditing) {
      <span class="task-text">{{ task.title }}</span>
    } @else {
      <input
        type="text"
        class="edit-input"
        [(ngModel)]="editTitle"
        (keyup.enter)="onSave()"
        (keyup.escape)="onCancel()"
      />
    }
    <span class="task-date">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M16 3v4M8 3v4M3 10h18" />
      </svg>
      {{ task.createdAt | date: 'dd.MM.yyyy H:mm' }}
    </span>
  </div>

  <div class="actions">
    @if (!isEditing) {
      <button type="button" class="icon-btn done" title="Выполнено" (click)="onToggleComplete()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.5l4.5 4.5L19 7.5" />
        </svg>
      </button>

      <button type="button" class="icon-btn edit" title="Редактировать" (click)="onEdit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z" />
          <path d="M13.5 6.5l4 4" />
        </svg>
      </button>

      <button type="button" class="icon-btn remove" title="Удалить" (click)="onDelete()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
        </svg>
      </button>
    } @else {
      <button type="button" class="text-btn save" (click)="onSave()">Сохранить</button>
      <button type="button" class="text-btn cancel" (click)="onCancel()">Отменить</button>
    }
  </div>
</div>
