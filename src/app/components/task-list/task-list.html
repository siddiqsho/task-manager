<main class="card">
  <header class="header">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.5l4.5 4.5L19 7.5" />
      </svg>
    </div>
    <div>
      <h1 class="title">Todo List</h1>
      <p class="subtitle">Планируй. Действуй. Достигай.</p>
    </div>
  </header>

  <app-task-input (taskAdded)="addNewTask($event)"></app-task-input>

  <div class="toolbar">
    <div class="filters">
      <button type="button" class="filter" [class.active]="filter === 'all'" (click)="setFilter('all')">Все</button>
      <button type="button" class="filter" [class.active]="filter === 'active'" (click)="setFilter('active')">Активные</button>
      <button type="button" class="filter" [class.active]="filter === 'completed'" (click)="setFilter('completed')">Выполненные</button>
    </div>
    <span class="counter">Всего задач: {{ tasks.length }}</span>
  </div>

  <div class="task-list">
    @for (task of filteredTasks; track task.id) {
      <app-task-item
        [task]="task"
        (delete)="askDelete($event)"
        (toggleComplete)="toggleTaskComplete($event)"
        (updateTask)="updateTask($event)">
      </app-task-item>
    } @empty {
      <p class="empty-message">Задач пока нет.</p>
    }
  </div>
</main>

@if (taskToDelete) {
  <app-confirm-modal
    [message]="'Вы действительно хотите удалить «' + taskToDelete.title + '»?'"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()">
  </app-confirm-modal>
}
